@if (pwaService.showPrompt()) {
<div class="pwa-overlay" role="dialog" aria-modal="true" aria-labelledby="pwa-dialog-title">
    <div class="pwa-sheet">
        <button #closeButton class="close-button" aria-label="Close installation prompt" (click)="onDismissClick()">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <h2 id="pwa-dialog-title" class="pwa-title">Install App</h2>
        <p class="pwa-description">Install our application for offline access, faster loading, and a better experience.
        </p>

        @switch (pwaService.platform()) {
        @case ('native') {
        <button class="install-button primary" (click)="onInstallClick()">
            Install Now
        </button>
        }
        @case ('ios') {
        <div class="ios-tutorial">
            <p>To install on iOS:</p>
            <ol>
                <li>Tap the <strong>Share</strong> button <svg class="inline-icon" viewBox="0 0 24 24" width="16"
                        height="16" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                        <polyline points="16 6 12 2 8 6"></polyline>
                        <line x1="12" y1="2" x2="12" y2="15"></line>
                    </svg> below.</li>
                <li>Select <strong>Add to Home Screen</strong> <svg class="inline-icon" viewBox="0 0 24 24" width="16"
                        height="16" stroke="currentColor" stroke-width="2" fill="none">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>.</li>
            </ol>
        </div>
        }
        }
    </div>
</div>
}
